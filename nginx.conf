server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /openapi.yaml {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/yaml;
        try_files $uri =404;
    }
}
